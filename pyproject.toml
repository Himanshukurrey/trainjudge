[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[project]
name = "trainjudge"
version = "0.3.1"
description = "Decide whether fine-tuning is the right fix, then verify it actually worked — on task metrics, not training loss."
dynamic = ["readme"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [
    { name = "Himanshu Kurrey", email = "himanshu98kurrey@gmail.com" },
]
keywords = ["fine-tuning", "lora", "mlx", "llm", "evaluation", "claude-code", "healthcare", "legal",
            "ecommerce", "customer-support", "hr", "bfsi", "education"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
# Local training and eval backend (Apple Silicon only).
mlx = [
    "mlx-lm>=0.31; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# PyTorch training and eval backend: NVIDIA GPUs (Windows/Linux), Apple MPS or CPU.
# For CUDA, install the matching torch wheel first (https://pytorch.org/get-started/).
cuda = [
    "torch>=2.2",
    "transformers>=4.45",
    "peft>=0.13",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/Himanshukurrey/trainjudge"
Issues = "https://github.com/Himanshukurrey/trainjudge/issues"

[project.scripts]
trainjudge = "trainjudge.cli:main"

# PyPI can't resolve the README's relative links and images, so the copy sent to PyPI
# points them at GitHub. The README in the repo stays relative.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# HTML images: <img src="..."> and <source srcset="...">
pattern = '(src|srcset)="(?!https?://|#)([^"]+)"'
replacement = '\g<1>="https://raw.githubusercontent.com/Himanshukurrey/trainjudge/main/\g<2>"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Markdown images: ![alt](path)
pattern = '!\[([^\]]*)\]\((?!https?://|#)([^)]+)\)'
replacement = '![\g<1>](https://raw.githubusercontent.com/Himanshukurrey/trainjudge/main/\g<2>)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# HTML links: <a href="...">
pattern = 'href="(?!https?://|#|mailto:)([^"]+)"'
replacement = 'href="https://github.com/Himanshukurrey/trainjudge/blob/main/\g<1>"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Markdown links: [text](path)
pattern = '(?<!!)\[([^\]]*)\]\((?!https?://|#|mailto:)([^)]+)\)'
replacement = '[\g<1>](https://github.com/Himanshukurrey/trainjudge/blob/main/\g<2>)'

[tool.hatch.build.targets.wheel]
packages = ["src/trainjudge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
# Generated verify output (reports with code samples), not source.
extend-exclude = ["demo/sql_generation/example-runs"]

[tool.ruff.lint]
# Curated, not ruff's moving defaults: E/F/I catch
# real mistakes (unused imports, undefined names, import order) and UP keeps
# syntax modern for the py310 floor.
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Fact tables: one fact per line reads better than wrapped strings.
"demo/domains/generate.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/trainjudge"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# The ML libraries are optional, heavy and only partly typed; treat them as untyped
# (they aren't installed in the lint job either).
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "peft", "peft.*", "mlx", "mlx.*",
          "mlx_lm", "mlx_lm.*", "numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true
