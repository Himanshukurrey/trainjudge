name: Publish to PyPI

# Fires when a GitHub Release is published (gh release create / the "Publish
# release" button), NOT on every tag push, so tagging alone can't trigger an
# accidental publish. Uses PyPI Trusted Publishing (OIDC): no API token is
# stored as a secret. One-time setup is required on PyPI before this works;
# see "Releasing" in CONTRIBUTING.md.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Sanity-check the built wheel actually installs and runs
        run: |
          python -m venv /tmp/trainjudge-release-check
          /tmp/trainjudge-release-check/bin/pip install dist/*.whl
          /tmp/trainjudge-release-check/bin/trainjudge --version
          /tmp/trainjudge-release-check/bin/trainjudge audit demo/sql_generation/data.jsonl > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/trainjudge/
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
