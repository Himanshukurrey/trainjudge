name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pushes to main run Linux only: macOS and Windows runner minutes are billed
        # at 10x and 2x on private repositories. Pull requests, manual runs
        # (`gh workflow run ci.yml`) and the weekly schedule run the full matrix.
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The test suite never downloads models or needs mlx-lm: training and
      # generation are exercised through fake backends, so CI runs everywhere.
      - name: Install trainjudge and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install trainjudge with dev tools
        run: pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format --check
        run: ruff format --check .

      - name: Type-check with mypy
        run: mypy

  demo-data:
    # The committed demo datasets must match what their generators produce.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install trainjudge
        run: pip install -e .

      - name: Regenerate demo datasets
        run: |
          for demo in sql_generation policy_docs domains/bfsi/transactions domains/bfsi/loan_faq; do
            python demo/$demo/generate.py
          done
          python demo/domains/generate.py

      - name: Check nothing changed
        run: git diff --exit-code -- demo/

  torch-integration:
    # Real LoRA training and generation with the PyTorch backend, on CPU with a
    # tiny model, so a breaking transformers/peft release is caught here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache the tiny test model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-smollm2-135m-instruct

      - name: Install CPU-only PyTorch and trainjudge
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,cuda]"

      - name: Train and generate on CPU
        env:
          TRAINJUDGE_TORCH_INTEGRATION: "1"
        run: pytest -v tests/test_torch_integration.py
