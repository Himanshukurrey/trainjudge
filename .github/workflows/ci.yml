name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The test suite never downloads models or needs mlx-lm: training and
      # generation are exercised through fake backends, so CI runs everywhere.
      - name: Install trainjudge and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format --check
        run: ruff format --check .

  demo-data:
    # The committed demo datasets must match what their generators produce.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install trainjudge
        run: pip install -e .

      - name: Regenerate demo datasets
        run: |
          for demo in sql_generation policy_docs bfsi_transactions bfsi_loan_faq; do
            python demo/$demo/generate.py
          done

      - name: Check nothing changed
        run: git diff --exit-code -- demo/
